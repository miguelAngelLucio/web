<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripciones</title>
</head>
<body background="mike-hindle-r3QmVUKw00s-unsplash.jpg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI';
        }

        nav {
            display: flex;
            justify-content: space-between;
            justify-content: right;
            padding: 0 1rem;
        }

        nav ul {
            display: flex;
            list-style-type: none;
        }
        nav ul li {
            list-style: none;
            padding: 0px 35px;
            margin: 10px;
            font-size: 16px;
            font-weight: 500;
            color: #222;
            cursor: pointer;
            transition: color 0.4s;
        }
        nav ul li a {
            text-decoration: none;
            color: inherit;
        }

        nav ul li::after {
            content: '';
            background: #222;
            width: 100%;
            height: 100%;
            border-radius: 10px;
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            opacity: 0;
        }
        
        nav ul li:hover {
            color: #a06c23;
        }

        nav ul li:hover::after {
            top: 50%;
            opacity: 0;
        }

        h1 {
            color:blanchedalmond;
            border-style: double;
            border-color: #ffffff;
            border-width: 3px;
            background-color: #222;
            
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family:'Segoe UI';
        }

        body {
            align-items: center;
            justify-content: center;
        }

        section {
            margin: 10px;
            justify-content: center;
        }

        .container {
            position: relative;
            max-width: 500px;
            width: 100%;
            background: #caa26b83;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }

        .container header {
            font-size: 1.5rem;
            color: #333;
            font-weight: 500;
            text-align: center;
        }

        .container .form {
            margin-top: 30px;
        }

        .form .input-box {
            width: 100%;
            margin-top: 20px;
        }

        .input-box label {
            color: #333;
            
        }

        .form :where(.input-box input, .select-box) {
            position: relative;
            height: 50px;
            width: 100%;
            outline: none;
            font-size: 1rem;
            color: #707070;
            margin-top: 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 0 15px;
            background-color: #dcdcdc;
        }

        .input-box input:focus {
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.1);
        }

        .form .column {
            display: flex;
            column-gap: 15px;
        }

        .form .gender-box {
            margin-top: 20px;
        }

        .gender-box h3 {
            color: #333;
            font-size: 1rem;
            font-weight: 400;
            margin-bottom: 8px;
        }

        .form :where(.gender-option, .gender) {
            display: flex;
            align-items: center;
            column-gap: 50px;
            flex-wrap: wrap;
        }

        .form .gender {
            column-gap: 5px;
        }

        .gender input {
            accent-color: rgb(34,222,184);
        }

        .form:where(.gender input, .gender label) {
            cursor: pointer;
        }

        .gender label {
            color: #707070;
        }

        .address :where(input, .select-box) {
            margin-top: 15px;
        }

        .form button {
            height: 55px;
            width: 100%;
            color: #eee;
            font-size: 1rem;
            font-weight: 400;
            margin-top: 30px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            background: rgba(98, 81, 13, 0.42);
        }
    </style>
    <nav>
        <ul>
            <li><a id="inicio" href="index.html">Inicio</a></li>
            <li><a id="Detalles" href="detalles.html">Detalles</a></li>
        </ul>
    </nav>
        <h1><marquee>INSCRIBETE YAA!!!</marquee></h1>
        <center><section class="container">
            <header>Inscribete</header>
            <form action="#" class="form">
                <div class="input-box">
                    <label>Nombre Completo (Mama, Papa o tutor)</label>
                    <input type="text" placeholder="Ingresa tu nombre completo" required>
                </div>

                <div class="input-box">
                    <label>Nombre Completo (Alumno a inscribir)</label>
                    <input type="text" placeholder="Ingresa tu nombre completo" required>
                </div>

                <div class="column">
                    <div class="input-box">
                        <label>Numero Telefonico</label>
                        <input type="number" placeholder="Ingresa tu numero telefonico" required>
                    </div>
                    <div class="input-box">
                        <label>Fecha de Nacimiento</label>
                        <input type="date" placeholder="Ingresa tu fecha de nacimiento" required>
                    </div>
                </div>
                <div class="gender-box">
                    <h3>Genero</h3>
                    <center><div class="gender-option">
                        <div class="gender">
                            <input type="radio" id="check-male" name="gender" checked>
                            <label for="check-male">Hombre</label>
                        </div>
                        <div class="gender">
                            <input type="radio" id="check-female" name="gender" checked>
                            <label for="check-female">Mujer</label>
                        </div>
                        <div class="gender">
                            <input type="radio" id="check-other" name="gender" checked>
                            <label for="check-other">Prefiero no decirlo</label>
                        </div>
                    </div></center>
                </div>
                <div class="input-box address">
                    <label>Direccion</label>
                    <input type="text" placeholder="Ingrese su direccion">
                </div>
                <button>Enviar</button>
            </form>
        </section></center>
</body>
</html>
